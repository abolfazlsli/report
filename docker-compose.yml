services:
  db:
    image: postgres:16-alpine
    container_name: report_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: report
      POSTGRES_PASSWORD: report
      POSTGRES_DB: report
    ports:
      - "5434:5432"
    volumes:
      - report_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U report -d report"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    container_name: report_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://report:report@db:5432/report
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-please-use-a-long-random-value}
      ACCESS_TOKEN_EXPIRE_MINUTES: 720
      CORS_ORIGINS: '["http://localhost:3000" , "https://report.besat.net"]'
      # true = demo school with sample data on first start; false = admin account only
      SEED_DEMO: ${SEED_DEMO:-true}
    ports:
      - "8002:8060"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8002
    container_name: report_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3002:3000"

volumes:
  report_pgdata: